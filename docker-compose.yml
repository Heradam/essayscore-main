version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-essay_scoring}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.backend
    container_name: flask_backend
    restart: always
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      OCR_API_KEY: ${OCR_API_KEY}
      OCR_SECRET_KEY: ${OCR_SECRET_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen-max}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-essay_scoring}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.frontend
    container_name: react_frontend
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
